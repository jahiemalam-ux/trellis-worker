name: Build and push TRELLIS.2 worker image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image is >12GB before Blender is added, and a stock ubuntu-latest
      # runner only leaves ~14GB free — build #29 died with "No space left on
      # device". Reclaiming preinstalled toolchains we never use buys ~30GB.
      - name: Reclaim runner disk
        run: |
          echo "=== before ==="
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          docker system prune -af --volumes || true
          echo "=== after ==="
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/trellis-worker:v1
          # mode=max caches every intermediate layer, which itself consumes
          # runner disk on a build this size. mode=min keeps the expensive
          # compile layers cached without hoarding the rest.
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Disk usage after build
        if: always()
        run: df -h /
